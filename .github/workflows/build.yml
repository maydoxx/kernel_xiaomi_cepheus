# This is a basic workflow to help you get started with Actions
name: build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Standard checkout WITHOUT using broken Git submodules
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # STEP 2: Manually clone AnyKernel3 (Fixes the Exit Code 128 error)
      - name: Setup AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          # Remove the broken submodule reference if it exists as a folder
          rm -rf AnyKernel3
          # Fresh clone of the AnyKernel3 toolset
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      # STEP 3: Clone KernelSU-Next into the root folder where the symlink points
      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          # Clean up any residual folder named KernelSU-Next in the root
          rm -rf KernelSU-Next
          
          # Clone KernelSU-Next recursively right into the root directory
          git clone --recursive https://github.com/rifsxd/KernelSU-Next KernelSU-Next
          
          # Quick sanity check: Force recreate the symlink just in case it was damaged
          rm -f drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          
      # STEP 4: Install toolchains & build essentials
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libssl-dev bison flex make zip

      # STEP 5: Run your custom compilation script
      - name: Build
        run: |
          bash ./build.sh

      # STEP 6: Package and upload the release
      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            out/*.zip
