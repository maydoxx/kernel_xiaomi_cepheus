name: build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup AnyKernel3
        run: |
          rm -rf AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Setup KernelSU-Next
        run: |
          rm -rf KernelSU-Next
          git clone --recursive https://github.com/rifsxd/KernelSU-Next KernelSU-Next
          rm -f drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libcrypto++-dev lz4 liblz4-tool ncurses-dev tcl zip libyaml-dev

      # Fetch both Clang AND the required GCC/Binutils toolchains
      - name: Fetch Toolchains
        run: |
          mkdir -p clang-aosp gcc-64 gcc-32
          
          # 1. Download official AOSP Clang
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -C clang-aosp -xzf clang.tar.gz
          
          # 2. Download AOSP GCC 64-bit Binutils (Provides aarch64-linux-gnu-ld)
          curl -Lo gcc64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          tar -C gcc-64 -xzf gcc64.tar.gz

          # 3. Download AOSP GCC 32-bit Binutils (Provides arm-linux-androideabi-ld)
          curl -Lo gcc32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          tar -C gcc-32 -xzf gcc32.tar.gz
          
          rm -f *.tar.gz

      # Execute script with complete paths mapped out
      - name: Build
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$GITHUB_WORKSPACE/gcc-64/bin:$GITHUB_WORKSPACE/gcc-32/bin:$PATH"
          bash ./build.sh

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            *.zip
