# This is a basic workflow to help you get started with Actions
name: build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf KernelSU-Next
          git clone --recursive https://github.com/rifsxd/KernelSU-Next KernelSU-Next
          rm -f drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libcrypto++-dev lz4 liblz4-tool ncurses-dev tcl vital-utils zip

      # FIX: Recreate raystef66's exact environment tree so build.sh works completely unmodified
      - name: Setup Raystef66 Fake Toolchain Environment
        run: |
          # 1. Create the base folders exactly matching the script paths
          sudo mkdir -p /home/raystef66/kernel/prebuilts/clang-r416183b1
          sudo mkdir -p /home/raystef66/kernel/prebuilts/aarch64/bin
          sudo mkdir -p /home/raystef66/kernel/prebuilts/arm/bin
          sudo chown -R runner:runner /home/raystef66

          # 2. Download AOSP Clang 12 (r416183b1) and extract into the fake path
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -C /home/raystef66/kernel/prebuilts/clang-r416183b1 -xzf clang.tar.gz
          rm clang.tar.gz

          # 3. Create structural symlinks for cross-compiling target binaries if missing
          # (AOSP Clang bundles LLVM utilities inside its own bin folder)
          ln -s /home/raystef66/kernel/prebuilts/clang-r416183b1/bin/llvm-ar /home/raystef66/kernel/prebuilts/aarch64/bin/aarch64-linux-gnu-ar || true
          ln -s /home/raystef66/kernel/prebuilts/clang-r416183b1/bin/ld.lld /home/raystef66/kernel/prebuilts/aarch64/bin/aarch64-linux-gnu-ld || true

      - name: Build
        run: |
          # Create a dummy script mock for makeparallel if build.sh requires it locally
          if [ ! -f "./makeparallel" ]; then
            echo '#!/bin/bash' > ./makeparallel
            echo 'make "$@"' >> ./makeparallel
            chmod +x ./makeparallel
          fi

          bash ./build.sh

      # Fix: Grab the finished zip package from the fake raystef66 directory
      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            /home/raystef66/kernel/*.zip
